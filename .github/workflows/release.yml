name: Release

# Pushing a version tag (MAJOR.MINOR.PATCH, with no `v`, matching workspace.package's
# `version`) builds `postmark-mcp` and `postmark-mcp-launcher` natively on
# Linux, Windows, and Apple Silicon macOS, packages each platform's release set
# (`bin/` holding both, plus `release.json`) as one checksummed archive, signs
# one `latest.json` describing every archive, and publishes them on a GitHub
# Release for that tag.
#
# The release starts as a prerelease, which `releases/latest` never serves, so
# no launcher can reach it yet. `verify-install` then installs it on every
# platform through its real manifest, signature, and archives, and only
# `promote` makes it the latest release. A failed install leaves a prerelease
# that launchers never see.
#
# Prerequisites: the repository is public, because the launcher downloads
# without credentials, and a `RELEASE_SIGNING_KEY` secret holds the private half
# of the key built into `crates/postmark-mcp-launcher/src/product.rs`,
# generated by `updater-keytool generate`. The signing tool is built from the
# same `zentelligence/auto-updater` commit the workspace pins.
#
# `workflow_dispatch` allows a manual dry run of the build and packaging matrix
# without publishing: the jobs after `build` only run for an actual tag push.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch: {}

# Read-only by default. Only the jobs that create and promote the release can
# write to it, so a compromised dependency compiled in `build`, or the updater
# built in `manifest`, cannot change a release after it has been verified.
permissions:
  contents: read

env:
  # Move both together with the updater crates in the workspace Cargo.toml.
  AUTO_UPDATER_REV: d01d5a1e944e60f9fdf3660dbc9ac03c823fa54b
  # Recorded in every release's metadata and manifest, as the updater's formats
  # require. The pinned updater enforces neither this nor the manifest's
  # `minimum_supported_version`, so they describe rather than restrict.
  MINIMUM_LAUNCHER_VERSION: "0.6.0"

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            suffix: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            suffix: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify tag matches workspace version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME}"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "${tag_version}" != "${cargo_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match workspace version ${cargo_version} in Cargo.toml"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build postmark-mcp and postmark-mcp-launcher (release)
        run: |
          cargo build --release --locked -p postmark-mcp --bin postmark-mcp --target ${{ matrix.target }}
          cargo build --release --locked -p postmark-mcp-launcher --bin postmark-mcp-launcher --target ${{ matrix.target }}

      - name: Assemble the release set and generate release.json
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          suffix="${{ matrix.suffix }}"
          staging="postmark-mcp-${version}-${{ matrix.target }}"
          mkdir -p "${staging}/bin"
          for program in postmark-mcp postmark-mcp-launcher; do
            cp "target/${{ matrix.target }}/release/${program}${suffix}" "${staging}/bin/"
          done
          cp README.md LICENSE NOTICE THIRD_PARTY_LICENSES.md "${staging}/"
          # The launcher is not declared: it is not a command the release
          # starts, but the program that installs the release.
          jq -n \
            --arg version "${version}" \
            --arg target "${{ matrix.target }}" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg minimum_launcher_version "${MINIMUM_LAUNCHER_VERSION}" \
            --arg path "bin/postmark-mcp${suffix}" \
            '{
              schema_version: 1,
              product: "postmark-mcp",
              version: $version,
              target: $target,
              published_at: $published_at,
              minimum_launcher_version: $minimum_launcher_version,
              commands: [{ name: "postmark-mcp", path: $path }]
            }' > "${staging}/release.json"
          echo "STAGING=${staging}" >> "${GITHUB_ENV}"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          # The updater reads `release.json` from the top of the archive, so the
          # archive holds the folder's contents, not the folder. COPYFILE_DISABLE
          # keeps macOS metadata files out.
          (cd "${STAGING}" && COPYFILE_DISABLE=1 tar -czf "../${STAGING}.tar.gz" *)
          shasum -a 256 "${STAGING}.tar.gz" > "${STAGING}.tar.gz.sha256"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:STAGING/*" -DestinationPath "$env:STAGING.zip"
          $hash = (Get-FileHash "$env:STAGING.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:STAGING.zip" | Out-File -Encoding ascii -NoNewline "$env:STAGING.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: postmark-mcp-${{ matrix.target }}
          path: |
            postmark-mcp-*.tar.gz
            postmark-mcp-*.tar.gz.sha256
            postmark-mcp-*.zip
            postmark-mcp-*.zip.sha256
          if-no-files-found: error

  manifest:
    name: build and sign latest.json
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check out the updater's signing tool
        uses: actions/checkout@v7
        with:
          repository: zentelligence/auto-updater
          ref: ${{ env.AUTO_UPDATER_REV }}
          path: auto-updater
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Build updater-keytool
        run: cargo build --release --locked -p updater-keytool --manifest-path auto-updater/Cargo.toml

      - name: Assemble latest.json from every target's archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          declare -A target_archive=(
            ["x86_64-unknown-linux-gnu"]="tar.gz"
            ["x86_64-pc-windows-msvc"]="zip"
            ["aarch64-apple-darwin"]="tar.gz"
          )

          assets="[]"
          for target in "${!target_archive[@]}"; do
            archive="postmark-mcp-${version}-${target}.${target_archive[$target]}"
            sha256="$(cut -d' ' -f1 "dist/${archive}.sha256")"
            size="$(stat -c%s "dist/${archive}")"
            assets="$(jq \
              --arg target "${target}" \
              --arg url "${base_url}/${archive}" \
              --arg sha256 "${sha256}" \
              --argjson size "${size}" \
              '. + [{target: $target, url: $url, sha256: $sha256, size: $size}]' <<< "${assets}")"
          done

          jq -n \
            --arg version "${version}" \
            --arg released_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg minimum_launcher_version "${MINIMUM_LAUNCHER_VERSION}" \
            --arg release_notes_url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --argjson assets "${assets}" \
            '{
              schema_version: 1,
              product: "postmark-mcp",
              channel: "stable",
              version: $version,
              released_at: $released_at,
              minimum_supported_version: $version,
              minimum_launcher_version: $minimum_launcher_version,
              release_notes_url: $release_notes_url,
              assets: $assets
            }' > dist/latest.json

      - name: Sign latest.json
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_KEY}" ]; then
            echo "::error::the RELEASE_SIGNING_KEY secret is not set"
            exit 1
          fi
          key_file="${RUNNER_TEMP}/release-signing-key"
          (umask 077 && printf '%s' "${RELEASE_SIGNING_KEY}" > "${key_file}")
          trap 'rm -f "${key_file}"' EXIT
          auto-updater/target/release/updater-keytool sign \
            --private-key-file "${key_file}" \
            --key-id release-2026 \
            dist/latest.json > dist/latest.json.sig

      - uses: actions/upload-artifact@v7
        with:
          name: manifest
          path: |
            dist/latest.json
            dist/latest.json.sig
          if-no-files-found: error

  publish:
    name: publish prerelease
    needs: manifest
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create a GitHub prerelease with the signed release sets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            --prerelease

  verify-install:
    name: verify install (${{ matrix.target }})
    needs: publish
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            suffix: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            suffix: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Install the published release set and run it through the launcher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # The tag's own manifest, because `releases/latest` does not serve a prerelease.
          POSTMARK_MCP_UPDATE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/latest.json
          POSTMARK_MCP_INSTALL_ROOT: ${{ runner.temp }}/install-root
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          suffix="${{ matrix.suffix }}"
          work="${RUNNER_TEMP}/verify"
          mkdir -p "${work}/unpacked"

          asset="postmark-mcp-${version}-${{ matrix.target }}.${{ matrix.archive }}"
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern "${asset}" --dir "${work}"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z x -bd -o"${work}/unpacked" "${work}/${asset}"
          else
            tar -xzf "${work}/${asset}" -C "${work}/unpacked"
          fi

          # Twice, because installing again must succeed and change nothing.
          "${work}/unpacked/bin/postmark-mcp-launcher${suffix}" install
          "${work}/unpacked/bin/postmark-mcp-launcher${suffix}" install
          "${work}/unpacked/bin/postmark-mcp-launcher${suffix}" update check

          if [[ -n "${suffix}" ]]; then
            commands="${POSTMARK_MCP_INSTALL_ROOT}/bin"
            powershell -NoProfile -Command "[Environment]::GetEnvironmentVariable('Path', 'User')" | grep -q 'install-root.bin' || {
              echo "::error::the commands' folder was not added to the user's Path"
              exit 1
            }
          else
            commands="${HOME}/.local/bin"
          fi
          expect() {
            local actual
            actual="$("$1" --version | tr -d '\r')"
            if [ "${actual}" != "$2" ]; then
              echo "::error::$1 reported '${actual}', expected '$2'"
              exit 1
            fi
          }
          expect "${commands}/postmark-mcp${suffix}" "postmark-mcp ${version}"
          expect "${commands}/postmark-mcp-launcher${suffix}" "postmark-mcp-launcher ${version}"

          # Removing it again must leave nothing behind, and report success.
          "${commands}/postmark-mcp-launcher${suffix}" uninstall --yes
          if [ -e "${POSTMARK_MCP_INSTALL_ROOT}" ] || [ -e "${commands}/postmark-mcp${suffix}" ]; then
            echo "::error::uninstall left files behind"
            exit 1
          fi
          if [[ -n "${suffix}" ]] && powershell -NoProfile -Command "[Environment]::GetEnvironmentVariable('Path', 'User')" | grep -q 'install-root.bin'; then
            echo "::error::uninstall left the commands' folder on the user's Path"
            exit 1
          fi

  promote:
    name: promote to latest
    needs: verify-install
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Make the verified release the one launchers receive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --prerelease=false --latest
